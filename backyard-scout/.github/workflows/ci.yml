name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Validate data catalog
      run: npm run catalog:validate

    - name: Catalog coverage report
      run: npm run catalog:report

    - name: Type check
      run: npm run typecheck

    - name: Lint check
      run: npm run lint

    - name: Format check
      run: npm run format:check

    - name: Run tests
      run: npm test