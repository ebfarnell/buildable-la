name: CI

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backyard-scout/package-lock.json

      - name: Install dependencies
        run: |
          cd backyard-scout
          npm ci

      - name: Run TypeScript type checking
        run: |
          cd backyard-scout
          npm run typecheck --if-present

      - name: Run ESLint
        run: |
          cd backyard-scout
          npm run lint --if-present

      - name: Check code formatting
        run: |
          cd backyard-scout
          npm run format:check --if-present

      - name: Run tests
        run: |
          cd backyard-scout
          npm test --if-present

      - name: Scan for secrets (advisory)
        run: |
          bash scripts/scan-secrets.sh || true
        continue-on-error: true

      - name: Build application
        run: |
          cd backyard-scout
          npm run build --if-present

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check file sizes
        run: |
          echo "Checking for large files..."
          find . -type f -size +10M -exec ls -lh {} \; | grep -v node_modules | grep -v .git || echo "No large files found (good!)"

      - name: Check for TODO items
        run: |
          echo "Checking for TODO items..."
          grep -r "TODO\|FIXME\|HACK" --include="*.ts" --include="*.js" --include="*.tsx" --include="*.jsx" --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist || echo "No TODOs found"
        continue-on-error: true